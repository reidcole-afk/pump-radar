services:
  - type: web
    name: pump-radar-learning-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: PUMP_RADAR_INGEST_KEY
        sync: false
