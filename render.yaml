services:
  - type: web
    name: pump-radar-learning-api
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm run server:start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: pump-radar-db
          property: connectionString
      - key: PUMP_RADAR_INGEST_KEY
        generateValue: true

databases:
  - name: pump-radar-db
    databaseName: pump_radar
    user: pump_radar
